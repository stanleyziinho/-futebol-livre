</style></head><body>
<div class="app" id="app"><header class="top"><div class="brand">STANLEY <span>TV</span><small>BOX EDITION â¢ V4.6</small></div><div class="top-right"><span class="info" id="total">Carregando canais...</span><button id="fullApp" class="primary">â¶ Tela TV</button><button id="manageBtn">â Playlists</button></div></header><div class="layout"><aside class="left"><h3>MINHAS PLAYLISTS</h3><div id="sources" class="sources"></div><div class="subactions"><button id="syncBtn">â» Sincronizar online</button><button id="favoritesBtn">â Favoritos</button></div></aside><main class="main"><nav id="categories" class="categorybar" aria-label="Categorias"></nav><div class="summary"><strong id="heading">Todos os canais</strong><span id="count"></span></div><div id="channels" class="grid" aria-label="Lista de canais"></div><div class="footer"><span id="status">Use as setas e OK do controle.</span><button id="more" class="hidden">+ Carregar mais canais</button></div></main></div></div>

<div id="manageOverlay" class="overlay" role="dialog" aria-modal="true"><div class="dialog"><h2>Minhas playlists</h2><p>As playlists do catÃ¡logo online sÃ£o carregadas automaticamente. Listas locais ficam somente neste aparelho.</p><input id="listName" placeholder="Nome da playlist (opcional)"><input id="listUrl" placeholder="https://endereco/lista.m3u"><div class="actions"><button id="addList" class="primary">Adicionar link M3U</button><button id="export">Exportar backup</button><button id="importBackup">Restaurar backup</button><button id="closeManage">Fechar</button></div><input type="file" id="backupFile" accept=".json" class="hidden"><div class="entries" id="manageEntries"></div><p id="manageStatus"></p></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),STORE='stanley-tv-v12',PREFIX='cloud-catalog:',CATALOG='stanley-tv-playlists.json';
let state={sources:[],favs:[]},selectedSource='all',category='Todos',onlyFav=false,displayLimit=40,visible=[],selected=null,selectedIndex=0,hls=null,focusBefore=null,loading=false;

const valid=u=>{try{const x=new URL(u,location.href);return /^https?:$/.test(x.protocol)?x.href:''}catch{return ''}};

function parseM3U(t,base){if(!/^\s*#EXTM3U(?:\s|$)/i.test(t)||/#EXT-X-(?:TARGETDURATION|MEDIA-SEQUENCE|STREAM-INF|KEY)\b/.test(t))throw Error('Fonte nÃ£o Ã© uma playlist de canais M3U');const out=[];let c=null;for(const raw of t.replace(/\r/g,'').split('\n')){let row=raw.trim();if(row.startsWith('#EXTINF')){const a=k=>(row.match(new RegExp(k+'="([^"]*)"','i'))||[])[1]||'';c={name:row.slice(row.indexOf(',')+1).trim(),logo:a('tvg-logo'),group:a('group-title')||'Outros'};}else if(row.startsWith('#EXTGRP:')&&c)c.group=row.slice(8);else if(row&&!row.startsWith('#')&&c){const url=valid(new URL(row,base).href);if(url&&c.name&&!/\.(?:ts|m4s)(?:[?#]|$)/i.test(url))out.push({...c,id:url,url});c=null}}return [...new Map(out.map(c=>[c.url,c])).values()]}
async function loadM3U(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return parseM3U(await r.text(),url)}
function groupOf(c){const g=String(c.group||'').toLowerCase();if(/sports?|esporte|soccer|football/.test(g))return 'Esportes';if(/movies?|filmes?|cinema/.test(g))return 'Filmes';if(/series|sÃ©ries|classic/.test(g))return 'SÃ©ries';if(/kids?|infantil|children|animation/.test(g))return 'Infantil';if(/news|notÃ­cias|legislative/.test(g))return 'NotÃ­cias';if(/music|mÃºsica/.test(g))return 'MÃºsica';if(/documentary|education|documentÃ¡rios/.test(g))return 'DocumentÃ¡rios';if(/entertainment|comedy|lifestyle/.test(g))return 'Entretenimento';if(/general|tv aberta/.test(g))return 'TV aberta';return 'Outros'}
function allSources(){const result=[],seen=new Set();for(const s of state.sources){if(!Array.isArray(s.items))continue;const key=s.url||s.id;if(seen.has(key))continue;seen.add(key);result.push(s)}return result}
function filtered(){const map=new Map();for(const s of allSources()){if(selectedSource!=='all'&&s.id!==selectedSource)continue;for(const c of s.items||[]){const u=valid(c.url);if(u&&!map.has(u))map.set(u,{...c,id:u,url:u})}}return [...map.values()].filter(c=>(category==='Todos'||groupOf(c)===category)&&(!onlyFav||state.favs.includes(c.url)))}
function button(label,cls,cb){const b=document.createElement('button');b.textContent=label;b.className=cls||'';b.onclick=cb;return b}
function setSource(id){selectedSource=id;category='Todos';onlyFav=false;displayLimit=40;render();$('categories').scrollLeft=0;$('channels').scrollTop=0}
function render(){const s=$('sources');s.replaceChildren();s.append(button('Todas as listas',''+(selectedSource==='all'?'active':''),()=>setSource('all')));for(const src of allSources())s.append(button(src.name+' Â· '+(src.items||[]).length,(selectedSource===src.id?'active':''),()=>setSource(src.id)));
const listBefore=(()=>{const ss=selectedSource;selectedSource='all';const vv=filtered();selectedSource=ss;return vv})();$('total').textContent=listBefore.length+' canais cadastrados';
const list=filtered(),groups=['Todos','Esportes','Filmes','SÃ©ries','Infantil','NotÃ­cias','TV aberta','MÃºsica','DocumentÃ¡rios','Entretenimento','Outros'];const cats=$('categories');cats.replaceChildren();for(const name of groups){const count=name==='Todos'?list.length:countCategory(name);if(!count&&name!=='Todos')continue;cats.append(button(name+' ('+count+')',name===category?'active':'',()=>{category=name;displayLimit=40;render();$('channels').scrollTop=0}))} 
$('heading').textContent=onlyFav?'â Favoritos':selectedSource==='all'?'Todos os canais':(allSources().find(s=>s.id===selectedSource)?.name||'Canais');$('count').textContent=list.length+' canais';visible=list;const grid=$('channels');grid.replaceChildren();for(const c of list.slice(0,displayLimit)){const b=button('','channel',()=>play(c));b.dataset.channel=c.url;b.setAttribute('aria-label','Assistir '+c.name);if(c.logo&&valid(c.logo)){const img=document.createElement('img');img.src=c.logo;img.loading='lazy';img.alt='';img.onerror=()=>{img.remove();const d=document.createElement('div');d.className='fallback';d.textContent='â¶';b.prepend(d)};b.append(img)}else{const d=document.createElement('div');d.className='fallback';d.textContent='â¶';b.append(d)}const title=document.createElement('b');title.textContent=c.name;b.append(title);grid.append(b)}$('more').classList.toggle('hidden',list.length<=displayLimit);$('more').textContent='Carregar mais ('+Math.max(0,list.length-displayLimit)+')'}
function countCategory(name){const s=selectedSource;const cat=category;category='Todos';const l=filtered();category=cat;return l.filter(c=>groupOf(c)===name).length}
function stop(){if(hls){hls.destroy();hls=null}const v=$('video');v.pause();v.removeAttribute('src');v.load();$('frame').src='about:blank';$('frame').classList.add('hidden');v.classList.remove('hidden')}
function play(c){focusBefore=document.activeElement;selected=c;selectedIndex=visible.findIndex(x=>x.url===c.url);stop();$('playerOverlay').classList.add('open');$('playingTitle').textContent=c.name;$('fav').textContent=state.favs.includes(c.url)?'â Favorito':'â Favorito';const p=$('videoStatus');p.classList.remove('off');p.textContent='Carregando transmissÃ£o...';const v=$('video'),url=c.url;v.onplaying=()=>p.classList.add('off');v.onerror=()=>{p.textContent='Falha ao reproduzir. Fonte indisponÃ­vel, codec ou bloqueio do servidor.'};const isHls=/\.m3u8(?:[?#]|$)/i.test(url);try{if(isHls&&v.canPlayType('application/vnd.apple.mpegurl')){v.src=url;v.play().catch(()=>{p.textContent='Pressione Play para iniciar.'})}else if(isHls&&window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:false});hls.loadSource(url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{p.textContent='Pressione Play para iniciar.'}));hls.on(Hls.Events.ERROR,(_,e)=>{if(e.fatal)p.textContent='TransmissÃ£o indisponÃ­vel ou bloqueada.'})}else{v.src=url;v.play().catch(()=>{p.textContent='Pressione Play para iniciar.'})}}catch{p.textContent='NÃ£o foi possÃ­vel iniciar este canal.'}$('closePlayer').focus()}
function closePlayer(){stop();$('playerOverlay').classList.remove('open');const old=focusBefore;render();const target=selected?Array.from(document.querySelectorAll('#channels .channel')).find(x=>x.dataset.channel===selected.url):null;(target||old&&old.isConnected&&old||$('channels .channel')).focus();selected=null}
$('closePlayer').onclick=closePlayer;$('prev').onclick=()=>{if(visible.length)play(visible[(selectedIndex-1+visible.length)%visible.length])};$('next').onclick=()=>{if(visible.length)play(visible[(selectedIndex+1)%visible.length])};$('fav').onclick=()=>{if(!selected)return;const i=state.favs.indexOf(selected.url);if(i<0)state.favs.push(selected.url);else state.favs.splice(i,1);save();$('fav').textContent=i<0?'â Favorito':'â Favorito'};
$('videoFull').onclick=()=>{const x=$('videoBox');if(x.requestFullscreen)x.requestFullscreen().catch(()=>status('Tela cheia nÃ£o permitida pelo navegador'));else if($('video').webkitEnterFullscreen)$('video').webkitEnterFullscreen()};
$('fullApp').onclick=()=>{if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}else{const p=document.documentElement.requestFullscreen?.();if(p)p.catch(()=>status('O navegador nÃ£o permite tela cheia'))}};
$('favoritesBtn').onclick=()=>{onlyFav=!onlyFav;displayLimit=40;render();$('channels .channel')?.focus()};$('more').onclick=()=>{displayLimit+=40;render();$('channels .channel:last-child')?.focus()};
function manage(){focusBefore=document.activeElement;$('manageOverlay').classList.add('open');renderManage();$('closeManage').focus()}function closeManage(){$('manageOverlay').classList.remove('open');render();$('manageBtn').focus()}$('manageBtn').onclick=manage;$('closeManage').onclick=closeManage;
function renderManage(){const x=$('manageEntries');x.replaceChildren();for(const s of allSources()){const r=document.createElement('div'),t=document.createElement('span');t.textContent=s.name+' ('+(s.items||[]).length+')';r.append(t);if(!String(s.id).startsWith(PREFIX))r.append(button('Remover','',()=>{if(!confirm('Remover '+s.name+' deste aparelho?'))return;state.sources=state.sources.filter(i=>i.id!==s.id);save();selectedSource='all';renderManage()}));else r.append(document.createTextNode('CatÃ¡logo online'));x.append(r)}}
$('addList').onclick=async()=>{const u=valid($('listUrl').value);if(!u||!u.startsWith('https:')||/\.m3u8(?:[?#]|$)/i.test(u))return status('Informe URL HTTPS de playlist .m3u');if(state.sources.some(s=>s.url===u))return status('Esta lista jÃ¡ estÃ¡ cadastrada');try{status('Importando...');const items=await loadM3U(u);state.sources.push({id:'list-'+Date.now(),name:$('listName').value.trim()||new URL(u).hostname,url:u,items});save();renderManage();status(items.length+' canais importados')}catch(e){status('Falha: '+e.message)}};
$('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({format:'stanley-tv-v4-compatible',sources:state.sources,favs:state.favs},null,2)],{type:'application/json'}));a.href=u;a.download='stanley-tv-box-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};
$('importBackup').onclick=()=>$('backupFile').click();$('backupFile').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.sources)||!Array.isArray(d.favs))throw Error('Backup invÃ¡lido');if(!confirm('Substituir as playlists e os favoritos locais?'))return;state={sources:d.sources,favs:d.favs};save();selectedSource='all';renderManage();render();status('Backup restaurado')}catch(e){status(e.message)}};
async function sync(){if(loading)return;loading=true;status('Sincronizando catÃ¡logo...');try{const r=await fetch(CATALOG+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('JSON HTTP '+r.status);const doc=await r.json();if(!Array.isArray(doc.playlists))throw Error('CatÃ¡logo invÃ¡lido');const old=new Map(state.sources.filter(s=>String(s.id).startsWith(PREFIX)).map(s=>[s.id,s]));const next=[];let errors=0;for(const p of doc.playlists){const url=valid(p.url);if(!url||!url.startsWith('https:')||/\.m3u8(?:[?#]|$)/i.test(url))continue;const id=PREFIX+String(p.id||p.name||url).replace(/[^a-z0-9_-]/gi,'').slice(0,60),prev=old.get(id);if(prev&&prev.url===url&&prev.items?.length){next.push({...prev,name:p.name||prev.name});continue}try{const items=await loadM3U(url);next.push({id,name:p.name||'Playlist online',url,items})}catch(e){errors++;if(prev)next.push(prev);else next.push({id,name:p.name||'Playlist online',url,items:[]})}}state.sources=[...state.sources.filter(s=>!String(s.id).startsWith(PREFIX)),...next];save();render();status('CatÃ¡logo: '+next.length+' listas, '+errors+' falhas.')}catch(e){status('Falha ao sincronizar: '+e.message)}finally{loading=false}}
$('syncBtn').onclick=sync;
// Controle: setas percorrem somente controles visÃ­veis; nÃ£o abrem campos de digitaÃ§Ã£o.
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'){if($('playerOverlay').classList.contains('open')){closePlayer();e.preventDefault()}else if($('manageOverlay').classList.contains('open')){closeManage();e.preventDefault()}return}if(!e.key.startsWith('Arrow'))return;if(e.target.tagName==='INPUT')return;const area=$('playerOverlay').classList.contains('open')?$('playerOverlay'):$('manageOverlay').classList.contains('open')?$('manageOverlay'):$('app');const btns=[...area.querySelectorAll('button')].filter(x=>!x.disabled&&x.getClientRects().length&&getComputedStyle(x).visibility!=='hidden');if(!btns.length)return;const active=document.activeElement;if(!btns.includes(active)){btns[0].focus();e.preventDefault();return}const a=active.getBoundingClientRect();let results=btns.filter(b=>b!==active).map(b=>{const r=b.getBoundingClientRect(),dx=r.left+r.width/2-(a.left+a.width/2),dy=r.top+r.height/2-(a.top+a.height/2),dir=e.key==='ArrowRight'?dx:e.key==='ArrowLeft'?-dx:e.key==='ArrowDown'?dy:-dy;return {b,dir,score:dir+2*(e.key==='ArrowRight'||e.key==='ArrowLeft'?Math.abs(dy):Math.abs(dx))}}).filter(x=>x.dir>4).sort((x,y)=>x.score-y.score);if(results[0]){results[0].b.focus();results[0].b.scrollIntoView({block:'nearest',inline:'nearest'});e.preventDefault()}});
render();sync();
})();
</script></body></html>
