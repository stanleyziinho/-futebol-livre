name: Atualizar filmes Stanley TV

on:
  workflow_dispatch:
  schedule:
    - cron: '20 11 * * *'

permissions:
  contents: write

concurrency:
  group: stanley-filmes-youtube
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Atualizar catalogo publico de filmes
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          KEY = os.environ.get('YOUTUBE_API_KEY', '').strip()
          if not KEY:
              sys.exit('ERRO: crie o secret YOUTUBE_API_KEY nas configuracoes do repositorio.')

          API = 'https://www.googleapis.com/youtube/v3/'

          def youtube(endpoint, **params):
              params['key'] = KEY
              url = API + endpoint + '?' + urllib.parse.urlencode(params)
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  error = exc.read().decode('utf-8', 'replace')[:400]
                  raise RuntimeError(
                      f'YouTube API HTTP {exc.code}: {error}'
                  ) from None

          def pages(endpoint, **params):
              token = None
              while True:
                  p = dict(params)
                  if token:
                      p['pageToken'] = token
                  data = youtube(endpoint, **p)
                  yield from data.get('items', [])
                  token = data.get('nextPageToken')
                  if not token:
                      break

          def seconds(duration):
              m = re.fullmatch(
                  r'P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?',
                  duration or ''
              )
              if not m:
                  return 0
              days, hours, mins, secs = (
                  int(n or 0) for n in m.groups()
              )
              return 86400*days + 3600*hours + 60*mins + secs

          channel = youtube(
              'channels',
              part='id,snippet,contentDetails',
              forHandle='@AdrenalinaPuraTVBR',
              maxResults=1
          )

          found = channel.get('items', [])
          if not found:
              sys.exit(
                  'ERRO: canal @AdrenalinaPuraTVBR nao localizado.'
              )

          channel_id = found[0]['id']
          uploads_id = found[0].get(
              'contentDetails', {}
          ).get('relatedPlaylists', {}).get('uploads')

          print(
              'Canal identificado:',
              found[0]['snippet'].get('title', channel_id)
          )

          lists = list(pages(
              'playlists',
              part='snippet',
              channelId=channel_id,
              maxResults=50
          ))

          playlist_ids = [
              (
                  x['id'],
                  x.get('snippet', {}).get('title', '')
              )
              for x in lists
          ]

          if uploads_id:
              playlist_ids.append(
                  (uploads_id, 'Envios do canal')
              )

          print('Playlists encontradas:', len(playlist_ids))

          video_ids = {}

          for playlist_id, playlist_title in playlist_ids:
              for item in pages(
                  'playlistItems',
                  part='contentDetails',
                  playlistId=playlist_id,
                  maxResults=50
              ):
                  vid = item.get(
                      'contentDetails', {}
                  ).get('videoId')

                  if vid:
                      video_ids.setdefault(
                          vid, set()
                      ).add(playlist_title)

          print(
              'Videos encontrados:',
              len(video_ids)
          )

          movies = []
          ids = list(video_ids)

          for start in range(0, len(ids), 50):
              batch = ids[start:start+50]

              result = youtube(
                  'videos',
                  part='snippet,contentDetails,status',
                  id=','.join(batch),
                  maxResults=50
              )

              for video in result.get('items', []):
                  snippet = video.get('snippet', {})
                  status = video.get('status', {})
                  title = snippet.get('title', '').strip()
                  vid = video['id']

                  runtime = seconds(
                      video.get(
                          'contentDetails', {}
                      ).get('duration', '')
                  )

                  if (
                      runtime < 55 * 60
                      or status.get('privacyStatus') != 'public'
                      or status.get('embeddable') is not True
                      or snippet.get('channelId') != channel_id
                      or not title
                  ):
                      continue

                  movies.append({
                      'id': 'adrenalina-' + vid,
                      'name': title,
                      'category': 'Filmes',
                      'type': 'youtube',
                      'videoId': vid,
                      'source': 'youtube',
                      'channel': snippet.get(
                          'channelTitle',
                          'Adrenalina Pura TV BR'
                      ),
                      'thumbnail': (
                          f'https://i.ytimg.com/vi/'
                          f'{vid}/hqdefault.jpg'
                      ),
                      'durationSeconds': runtime,
                      'publishedAt': snippet.get(
                          'publishedAt', ''
                      )
                  })

          movies.sort(
              key=lambda x: x['publishedAt'],
              reverse=True
          )

          output = {
              'version': 1,
              'source': 'Adrenalina Pura TV BR',
              'channelId': channel_id,
              'updatedAt': datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              'count': len(movies),
              'items': movies
          }

          if not movies:
              sys.exit(
                  'ERRO: nenhum filme incorporavel encontrado. '
                  'Catalogo anterior preservado.'
              )

          path = Path('stanley-filmes.json')
          path.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ) + '\n',
              encoding='utf-8'
          )

          print(
              'Catalogo gerado:',
              path,
              '| filmes:',
              len(movies)
          )
          PY

      - name: Salvar catalogo no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stanley-filmes.json
          if git diff --cached --quiet; then
            echo "Catalogo sem alteracoes"
          else
            git commit -m "Atualizar catalogo de filmes do YouTube"
            git push
          fi