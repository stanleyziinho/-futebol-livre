<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>Pênaltis • Stanley Sports</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030a06;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

/* TOPO STANLEY */

.ss-game-top{
  position:fixed;
  z-index:20;
  top:0;
  left:0;
  right:0;

  min-height:58px;

  padding:
    calc(8px + env(safe-area-inset-top))
    12px
    8px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
    linear-gradient(
      180deg,
      rgba(3,16,8,.98),
      rgba(3,16,8,.92)
    );

  border-bottom:
    1px solid
    rgba(56,228,125,.16);
}

.ss-back{
  color:#b7c9bd;
  text-decoration:none;
  font-size:12px;
  font-weight:900;
}

.ss-title{
  text-align:center;
}

.ss-title strong{
  display:block;
  color:#fff;
  font-size:13px;
}

.ss-title small{
  display:block;
  margin-top:2px;
  color:#38e47d;
  font-size:7px;
  font-weight:950;
  letter-spacing:1px;
}

.ss-premium{
  padding:6px 8px;

  border-radius:999px;

  color:#ffd45a;

  background:
    rgba(255,212,90,.10);

  border:
    1px solid
    rgba(255,212,90,.28);

  font-size:8px;
  font-weight:950;
}

/* JOGO */

#gameFrame{
  position:fixed;

  left:0;
  right:0;

  top:
    calc(
      58px +
      env(safe-area-inset-top)
    );

  bottom:0;

  width:100%;
  height:
    calc(
      100% -
      58px -
      env(safe-area-inset-top)
    );

  border:0;

  background:#07170e;
}

/* BLOQUEIO PREMIUM */

.ss-lock{
  min-height:100vh;

  padding:
    env(safe-area-inset-top)
    25px
    env(safe-area-inset-bottom);

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;

  background:
    radial-gradient(
      circle at top,
      #174d2b,
      #07170e 52%,
      #030a06
    );

  color:#fff;
}

.ss-lock-icon{
  font-size:64px;
}

.ss-lock h1{
  margin:12px 0 5px;
  font-size:27px;
}

.ss-lock p{
  margin:0;
  max-width:320px;

  color:#98ad9e;

  font-size:12px;
  line-height:1.6;
}

.ss-lock a{
  width:100%;
  max-width:320px;

  margin-top:20px;
  padding:15px;

  border-radius:14px;

  text-decoration:none;

  background:#ffd45a;
  color:#171000;

  font-weight:950;
}

</style>

</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
STANLEY SPORTS — PREMIUM
========================================================= */

const PREMIUM_KEY =
  "stanleyPremium30";

function ssPremiumGameActive(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          PREMIUM_KEY
        )
      );

    return Boolean(
      data
      &&
      data.expires
      &&
      Date.now()
      <
      Number(data.expires)
    );

  }catch(error){

    return false;

  }

}


/* =========================================================
USUÁRIO FREE
========================================================= */

if(
  !ssPremiumGameActive()
){

  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="ss-lock">

      <div class="ss-lock-icon">
        👑
      </div>

      <h1>
        Jogo Premium
      </h1>

      <p>
        Pênaltis está disponível
        exclusivamente para usuários
        Stanley Sports Premium.
      </p>

      <a href="../index.html">
        VOLTAR AO STANLEY SPORTS
      </a>

    </div>

  `;

}


/* =========================================================
USUÁRIO PREMIUM
========================================================= */

else{

  document.getElementById(
    "app"
  ).innerHTML = `

    <header class="ss-game-top">

      <a
        class="ss-back"
        href="../index.html"
      >
        ‹ Voltar
      </a>


      <div class="ss-title">

        <strong>
          ⚽ Pênaltis
        </strong>

        <small>
          STANLEY SPORTS GAMES
        </small>

      </div>


      <div class="ss-premium">
        👑 PREMIUM
      </div>

    </header>


    <iframe
      id="gameFrame"
      src="https://mashukui.github.io/web-games/penalty-kick/"
      allow="
        autoplay;
        fullscreen
      "
      title="Penalty Kick"
    ></iframe>

  `;

}

</script>

</body>
</html>
