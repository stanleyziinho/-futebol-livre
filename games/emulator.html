<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>Emulador • Stanley Sports</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#030a06;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    calc(18px + env(safe-area-inset-bottom));
}

.ss-wrap{
  width:min(100%,700px);
  margin:auto;
}

.ss-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.ss-back{
  color:#a8baae;
  text-decoration:none;
  font-size:12px;
  font-weight:900;
}

.ss-premium{
  padding:7px 10px;
  border-radius:999px;
  color:#ffd45a;
  background:rgba(255,212,90,.10);
  border:1px solid rgba(255,212,90,.28);
  font-size:8px;
  font-weight:950;
}

.ss-head{
  margin-bottom:18px;
}

.ss-head small{
  color:#38e47d;
  font-size:8px;
  font-weight:950;
  letter-spacing:1px;
}

.ss-head h1{
  margin:6px 0 4px;
  font-size:28px;
}

.ss-head p{
  margin:0;
  color:#8fa393;
  font-size:11px;
  line-height:1.5;
}

.ss-upload{
  padding:20px;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      #0f2b1a,
      #07140c
    );

  border:
    1px solid
    rgba(56,228,125,.18);

  text-align:center;
}

.ss-upload-icon{
  font-size:48px;
}

.ss-upload h2{
  margin:10px 0 4px;
  font-size:20px;
}

.ss-upload p{
  margin:0;
  color:#90a395;
  font-size:10px;
  line-height:1.5;
}

.ss-file{
  display:none;
}

.ss-select{
  display:block;

  width:100%;

  margin-top:18px;
  padding:15px;

  border:0;
  border-radius:14px;

  background:#38e47d;
  color:#03210d;

  font-size:12px;
  font-weight:950;

  cursor:pointer;
}

.ss-bios{
  display:block;

  width:100%;

  margin-top:10px;
  padding:13px;

  border-radius:14px;

  background:#13281b;
  color:#c0d0c4;

  border:
    1px solid
    rgba(255,255,255,.10);

  font-size:10px;
  font-weight:850;

  cursor:pointer;
}

.ss-bios-input{
  display:none;
}

.ss-file-name{
  margin-top:12px;
  color:#ffd45a;
  font-size:10px;
  word-break:break-word;
}

.ss-start{
  display:none;

  width:100%;

  margin-top:12px;
  padding:15px;

  border:0;
  border-radius:14px;

  background:#ffd45a;
  color:#171000;

  font-size:12px;
  font-weight:950;
}

.ss-start.show{
  display:block;
}

.ss-info{
  margin-top:15px;
  padding:14px;

  border-radius:15px;

  background:#0b1d12;

  color:#869b8c;

  font-size:9px;
  line-height:1.55;
}

#game{
  width:100%;
  height:100%;
}

#gameBox{
  display:none;

  position:fixed;

  inset:0;

  z-index:100;

  background:#000;
}

.ss-game-close{
  position:fixed;

  z-index:10000;

  top:
    calc(
      8px +
      env(safe-area-inset-top)
    );

  left:8px;

  padding:9px 12px;

  border-radius:999px;

  background:
    rgba(3,16,8,.88);

  border:
    1px solid
    rgba(255,255,255,.16);

  color:#fff;

  font-size:10px;
  font-weight:950;

  cursor:pointer;
}

.ss-lock{
  min-height:88vh;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;
}

.ss-lock div{
  font-size:60px;
}

.ss-lock h2{
  margin:10px 0 5px;
}

.ss-lock p{
  max-width:300px;
  color:#91a496;
  font-size:12px;
}

.ss-lock a{
  width:100%;
  max-width:300px;

  margin-top:15px;
  padding:14px;

  border-radius:14px;

  background:#ffd45a;
  color:#171000;

  text-decoration:none;
  font-weight:950;
}

</style>

</head>

<body>

<div id="app"></div>

<div id="gameBox">

  <button
    class="ss-game-close"
    onclick="location.reload()"
  >
    ✕ SAIR
  </button>

  <div id="game"></div>

</div>


<script>

/* =====================================================
PREMIUM
===================================================== */

const PREMIUM_KEY =
  "stanleyPremium30";


function premiumActive(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          PREMIUM_KEY
        )
      );

    return Boolean(
      data
      &&
      data.expires
      &&
      Date.now()
      <
      Number(data.expires)
    );

  }catch(e){

    return false;

  }

}


/* =====================================================
CONFIGURAÇÃO ESCOLHIDA
===================================================== */

const core =
  localStorage.getItem(
    "ssRetroCore"
  )
  ||
  "nes";


const consoleName =
  localStorage.getItem(
    "ssRetroName"
  )
  ||
  "Console";


/* =====================================================
FREE
===================================================== */

if(
  !premiumActive()
){

  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="ss-lock">

      <div>
        👑
      </div>

      <h2>
        Retro Games Premium
      </h2>

      <p>
        O emulador está disponível
        somente para usuários Premium.
      </p>

      <a href="../index.html">
        VOLTAR AO STANLEY SPORTS
      </a>

    </div>

  `;

}


/* =====================================================
PREMIUM
===================================================== */

else{

  document.getElementById(
    "app"
  ).innerHTML = `

    <main class="ss-wrap">

      <div class="ss-top">

        <a
          href="./retro.html"
          class="ss-back"
        >
          ‹ Central Retrô
        </a>

        <div class="ss-premium">
          👑 PREMIUM
        </div>

      </div>


      <div class="ss-head">

        <small>
          STANLEY SPORTS • EMULATOR
        </small>

        <h1>
          🎮 ${consoleName}
        </h1>

        <p>
          Escolha um arquivo compatível
          para iniciar o jogo.
        </p>

      </div>


      <section class="ss-upload">

        <div class="ss-upload-icon">
          🕹️
        </div>

        <h2>
          Carregar jogo
        </h2>

        <p>
          Selecione no seu aparelho
          um arquivo compatível com
          ${consoleName}.
        </p>


        <label
          class="ss-select"
          for="gameFile"
        >
          📂 ESCOLHER JOGO
        </label>

        <input
          id="gameFile"
          class="ss-file"
          type="file"
        >


        <label
          class="ss-bios"
          for="biosFile"
        >
          ⚙️ BIOS opcional
        </label>

        <input
          id="biosFile"
          class="ss-bios-input"
          type="file"
        >


        <div
          id="fileName"
          class="ss-file-name"
        ></div>


        <button
          id="startBtn"
          class="ss-start"
          onclick="startEmulator()"
        >
          ▶ INICIAR JOGO
        </button>

      </section>


      <div class="ss-info">

        O arquivo é carregado diretamente
        do seu aparelho para o navegador.

        <br><br>

        O Stanley Sports não precisa
        armazenar o jogo no servidor.

      </div>

    </main>

  `;

}


/* =====================================================
ARQUIVOS
===================================================== */

let selectedGame = null;
let selectedBios = null;


const gameInput =
  document.getElementById(
    "gameFile"
  );


const biosInput =
  document.getElementById(
    "biosFile"
  );


if(
  gameInput
){

  gameInput.addEventListener(
    "change",
    function(){

      selectedGame =
        this.files?.[0]
        ||
        null;


      if(
        !selectedGame
      ){
        return;
      }


      document.getElementById(
        "fileName"
      ).textContent =
        "🎮 "
        +
        selectedGame.name;


      document.getElementById(
        "startBtn"
      ).classList.add(
        "show"
      );

    }
  );

}


if(
  biosInput
){

  biosInput.addEventListener(
    "change",
    function(){

      selectedBios =
        this.files?.[0]
        ||
        null;

    }
  );

}


/* =====================================================
INICIA EMULATORJS
===================================================== */

function startEmulator(){

  if(
    !selectedGame
  ){
    return;
  }


  const gameUrl =
    URL.createObjectURL(
      selectedGame
    );


  let biosUrl = "";

  if(
    selectedBios
  ){

    biosUrl =
      URL.createObjectURL(
        selectedBios
      );

  }


  document.getElementById(
    "app"
  ).style.display =
    "none";


  document.getElementById(
    "gameBox"
  ).style.display =
    "block";


  window.EJS_player =
    "#game";


  window.EJS_core =
    core;


  window.EJS_gameName =
    selectedGame.name;


  window.EJS_gameUrl =
    gameUrl;


  window.EJS_pathtodata =
    "https://cdn.emulatorjs.org/stable/data/";


  window.EJS_startOnLoaded =
    true;


  window.EJS_askBeforeExit =
    false;


  /*
  Força interface adequada
  para celular.
  */
  window.EJS_browserMode =
    "mobile";


  if(
    biosUrl
  ){

    window.EJS_biosUrl =
      biosUrl;

  }


  const script =
    document.createElement(
      "script"
    );


  script.src =
    "https://cdn.emulatorjs.org/stable/data/loader.js";


  document.body.appendChild(
    script
  );

}

</script>

</body>

</html>
