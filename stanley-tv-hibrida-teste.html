function clear(){seq++;if(hls){try{hls.destroy()}catch{}hls=null}const v=$('video');v.onplaying=null;v.onerror=null;try{v.pause();v.removeAttribute('src');v.load()}catch{}const y=$('youtube');y.src='about:blank';y.classList.add('hidden');v.classList.add('hidden')}
function sourceOptions(c){const urls=[...new Set(c.urls?.length?c.urls:[c.url])].filter(Boolean);const ordered=[...urls.filter(u=>failures[u]?.status==='ok'),...urls.filter(u=>!failures[u]),...urls.filter(u=>failures[u]?.status==='fail')];return [...new Set(ordered)]}
function play(c){if(!c)return;clear();current=c;$('shell').classList.add('mini-on');$('playing').textContent=c.name;$('playerSub').textContent=c.category+(c.type==='youtube'?' · YouTube':' · IPTV');$('liveBadge').textContent=c.type==='youtube'?'VÍDEO':'AO VIVO';$('favorite').textContent=saved.favs.includes(c.id)?'♥ Favorito':'♡ Favorito';render();if(c.type==='youtube'){$('youtube').classList.remove('hidden');$('youtube').src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(c.videoId)+'?playsinline=1&rel=0&autoplay=1';$('notice').classList.add('hidden');diagnostic('Player oficial do YouTube. Anúncios e controles pertencem ao YouTube.');return}const urls=sourceOptions(c);if(!urls.length){note('Canal sem fonte válida');return}let attempt=0;const token=seq;function trySource(){if(token!==seq)return;if(hls){try{hls.destroy()}catch{}hls=null}const v=$('video');v.pause();v.removeAttribute('src');v.load();if(attempt>=urls.length){note('Nenhuma das '+urls.length+' fonte(s) funcionou neste aparelho.');diagnostic('Falhas registradas localmente; canal preservado no catálogo.');render();return}const url=urls[attempt++];const index=attempt;note('Verificando fonte '+index+' de '+urls.length+'...');diagnostic('Tentando fonte '+index+' de '+urls.length);let played=false,failed=false;const fail=(reason)=>{if(failed||played||token!==seq)return;failed=true;failures[url]={status:'fail',time:Date.now()};failSave();diagnostic('Fonte '+index+' falhou: '+reason);trySource()};const ok=()=>{if(token!==seq)return;played=true;failures[url]={status:'ok',time:Date.now()};failSave();$('notice').classList.add('hidden');diagnostic('Reproduzindo fonte '+index+' de '+urls.length)};v.classList.remove('hidden');v.onplaying=ok;v.onerror=()=>fail('Erro de mídia '+(v.error?.code||'?'));const start=()=>{if(token!==seq)return;try{const p=v.play();p?.catch?.(e=>{if(token===seq)note('Pressione Play para iniciar ('+e.name+')')})}catch(e){diagnostic(e.message)}};try{const native=v.canPlayType('application/vnd.apple.mpegurl');if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&native){v.src=url;v.load();start()}else if(window.Hls&&Hls.isSupported()){const engine=new Hls({enableWorker:false,lowLatencyMode:false,maxBufferLength:18,backBufferLength:4,maxBufferSize:16*1024*1024});hls=engine;engine.on(Hls.Events.MEDIA_ATTACHED,()=>{if(token===seq&&hls===engine)engine.loadSource(url)});engine.on(Hls.Events.MANIFEST_PARSED,()=>{if(token===seq&&hls===engine)start()});engine.on(Hls.Events.ERROR,(_,e)=>{if(token!==seq||hls!==engine)return;if(e.fatal){if(e.type===Hls.ErrorTypes.MEDIA_ERROR&&played){try{engine.recoverMediaError()}catch{}}else fail(e.details)}});engine.attachMedia(v)}else if(native){v.src=url;v.load();start()}else fail('HLS não suportado')}catch(e){fail(e.message)}}trySource()}
function closePlayer(){if(expanded)toggleExpand();clear();current=null;$('shell').classList.remove('mini-on');render()}
function toggleExpand(){expanded=!expanded;$('player').classList.toggle('expanded',expanded);$('shade').classList.toggle('on',expanded);$('expand').textContent=expanded?'↙ Reduzir':'⛶ Expandir'}
function advance(d){if(!shown.length)return;const i=shown.findIndex(x=>x.id===current?.id);play(shown[(i+d+shown.length)%shown.length])}
$('prev').onclick=()=>advance(-1);$('next').onclick=()=>advance(1);$('retry').onclick=()=>play(current);$('close').onclick=closePlayer;$('minimize').onclick=()=>{if(expanded)toggleExpand();else closePlayer()};$('expand').onclick=toggleExpand;$('shade').onclick=()=>{if(expanded)toggleExpand()};$('favorite').onclick=()=>{if(!current)return;let i=saved.favs.indexOf(current.id);if(i>=0)saved.favs.splice(i,1);else saved.favs.push(current.id);save();$('favorite').textContent=i>=0?'♡ Favorito':'♥ Favorito';render()};$('more').onclick=()=>{limit+=24;render()};$('search').oninput=e=>{query=e.target.value.trim();limit=24;render()};$('popular').onclick=()=>{category='Destaques';render()};$('favoritesTab').onclick=()=>{category='Favoritos';render()};$('clearFailures').onclick=()=>{failures={};failSave();render();$('status').textContent='Histórico de falhas limpo neste aparelho.'};$('tvMode').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch?.(()=>{})};
async function sync(){if(busy)return;busy=true;$('refresh').disabled=true;$('status').textContent='Sincronizando playlists...';try{const resp=await fetch(CATALOG+'?v='+Date.now(),{cache:'no-store'});if(!resp.ok)throw Error('HTTP '+resp.status);const doc=await resp.json();if(!Array.isArray(doc.playlists))throw Error('Catálogo inválido');const records=[];let failCount=0;for(const p of doc.playlists){const url=valid(p.url);if(!url)continue;try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),18000);let result;try{result=await fetch(url,{cache:'no-store',signal:controller.signal})}finally{clearTimeout(timeout)}if(!result.ok)throw Error('HTTP '+result.status);records.push(...parseM3U(await result.text(),url,p))}catch{failCount++}}if(records.length){iptv=compactChannels(records);try{sessionStorage.setItem(CACHE,JSON.stringify(iptv))}catch{}}$('status').textContent=records.length+' entradas agrupadas em '+iptv.length+' canais IPTV · '+failCount+' lista(s) falharam. Compatibilidade é avaliada por aparelho.';render()}catch(e){$('status').textContent='Erro ao carregar catálogo: '+e.message;render()}finally{busy=false;$('refresh').disabled=false}}
$('refresh').onclick=sync;
document.addEventListener('keydown',e=>{if((e.key==='Escape'||e.key==='Backspace')&&!['INPUT','TEXTAREA'].includes(e.target.tagName)){if(expanded)toggleExpand();else if(current)closePlayer();e.preventDefault();return}if(!e.key.startsWith('Arrow')||['INPUT','VIDEO'].includes(e.target.tagName))return;const btns=[...document.querySelectorAll('button')].filter(b=>!b.disabled&&b.getClientRects().length);const a=document.activeElement;if(!btns.includes(a)){btns[0]?.focus();e.preventDefault();return}const r=a.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;let closest=null,score=Infinity;for(const b of btns){if(b===a)continue;const q=b.getBoundingClientRect(),dx=q.left+q.width/2-x,dy=q.top+q.height/2-y,forward=e.key==='ArrowRight'?dx:e.key==='ArrowLeft'?-dx:e.key==='ArrowDown'?dy:-dy;if(forward<=3)continue;const side=/Right|Left/.test(e.key)?Math.abs(dy):Math.abs(dx),s=forward+2*side;if(s<score){score=s;closest=b}}if(closest){closest.focus();closest.scrollIntoView({block:'nearest',inline:'nearest'});e.preventDefault()}});
try{const cached=JSON.parse(sessionStorage.getItem(CACHE)||'null');if(Array.isArray(cached))iptv=cached}catch{}
render();sync();
})();
