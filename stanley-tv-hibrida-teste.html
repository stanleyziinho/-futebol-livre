<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:16px Arial,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:3px}button{border:0}.hidden{display:none!important}

ttom-color:var(--accent)}.stats{color:#94bba4;font-size:12px}.titlebar{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 20px;gap:10px}.titlebar h1{font-size:26px;font-weight:700;margin:0}.titlebar span{color:#94ab9b;font-size:13px}.postergrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:30px 21px;align-content:start}.poster{border:0;background:none;color:white;text-align:left;padding:0;min-width:0}.art{aspect-ratio:2/3;border-radius:13px;background:linear-gradient(145deg,#17432d,#080f0d);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;border:1px solid #315341;box-shadow:0 12px 24px #0007;transition:transform .15s,border-color .15s}.poster:hover .art,.poster:focus-visible .art{transform:scale(1.035);border-color:var(--bright)}.art img{width:100%;height:100%;object-fit:cover}.art.logo img{object-fit:contain;padding:12px;background:radial-gradient(#1f4433,#0b1b13)}.placeholder{font-size:45px;text-align:center;word-break:break-word}.poster .name{display:block;font-size:15px;line-height:1.25;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.poster .meta{display:block;color:#a2b2a8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.playchip{position:absolute;left:7px;top:7px;background:#082b1ccf;color:#5bffc2;border:1px solid #318863;border-radius:6px;font-size:10px;padding:4px 6px;letter-spacing:.2px}.favdot{position:absolute;right:8px;top:5px;color:#ffdd78;text-shadow:0 1px 4px #000;font-size:22px}.more{display:block;margin:28px auto 15px;background:#153e2a;color:#dbffeb;padding:12px 24px;border-radius:20px;border:1px solid #408963}.info{color:#a1b9a9;font-size:12px;line-height:1.5;margin:10px 0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.tools button{border:1px solid #3f7657;background:#0f3222;padding:9px 12px;border-radius:9px;font-size:12px}.tools button:hover{background:#1b5738}
.viewer{position:fixed;inset:0;background:#020806ec;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.viewer-inner{width:min(1060px,98vw);max-height:98dvh;overflow-y:auto;background:#0e1c15;border:1px solid #368363;border-radius:16px;box-shadow:0 18px 80px #000}.viewerhead{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 16px}.viewerhead strong{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewerhead button,.controls button{padding:10px 14px;border-radius:9px;background:#1a3e2b;border:1px solid #376c4e}.viewerhead button:hover,.controls button:hover{background:#278856}.screen{background:#000;width:100%;aspect-ratio:16/9;position:relative}.screen iframe,.screen video{width:100%;height:100%;border:0;display:block;background:#000}.screen .notice{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;font-size:17px;color:white;pointer-events:none;background:#07100a99}.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:9px;padding:13px}.controls button.primary{background:#07b976;color:#052114;font-weight:bold}.diag{color:#aac6b2;font:12px/1.5 monospace;padding:0 17px 15px;overflow-wrap:anywhere}.viewerfoot{padding:0 15px 13px;text-align:center;color:#9fbaa7;font-size:12px}
@media(max-width:1280px){.shell{grid-template-columns:70px 185px minmax(0,1fr)}.sidebtn{font-size:16px}.content{padding:21px}.postergrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:21px 16px}.rail button{width:52px}}
@media(max-width:820px){.shell{grid-template-columns:62px minmax(0,1fr)}.rail{grid-column:1;grid-row:1}.side{grid-column:2;position:relative;top:auto;height:auto;max-height:170px;padding:10px 15px;display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;border-bottom:1px solid #315643}.side h2,.side-divider,.side-foot{display:none}.sidebtn{width:auto;flex:none;padding:10px 15px;font-size:14px}.content{grid-column:2;padding:15px}.postergrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px}.titlebar h1{font-size:20px}.top{margin-bottom:10px}.rail{padding:12px 5px}.rail button{font-size:23px;width:50px;height:58px}.rail small{font-size:9px}}
@media(max-width:500px){.shell{grid-template-columns:48px minmax(0,1fr)}.rail button{width:39px;font-size:20px}.rail-logo{font-size:8px}.content{padding:12px}.postergrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 12px}.search{min-width:140px}.search input{padding:10px 10px 10px 36px}.tabs button{font-size:13px;padding:8px}.stats{font-size:10px}.poster .name{font-size:13px}.viewer{padding:5px}.viewerhead strong{font-size:15px}.controls button{padding:9px;font-size:12px}.art{border-radius:9px}}
</style>
</head>
<body>
<div class="shell">
 <nav class="rail" aria-label="Menu principal"><div class="rail-logo">STANLEY<br>TV</div><button id="home" class="active" title="Início">⌂<small>Início</small></button><button id="iptv" title="Canais IPTV">▣<small>IPTV</small></button><button id="youtubeMode" title="YouTube">▷<small>Vídeos</small></button><button id="favorites" title="Favoritos">☆<small>Favoritos</small></button><button id="tvMode" title="Tela cheia">⛶<small>Tela TV</small></button></nav>
 <aside class="side" id="side" aria-label="Categorias"></aside>
 <main class="content">
 <div class="top"><label class="search"><input type="search" id="search" placeholder="Buscar canais ou vídeos" autocomplete="off"></label><div class="tabs"><button id="popular" class="active">Populares</button><button id="favTab">Favoritos</button></div><span class="stats" id="total">Carregando IPTV...</span></div>
 <div class="titlebar"><h1 id="heading">Destaques</h1><span id="counter"></span></div>
 <div class="postergrid" id="cards"></div><button id="more" class="more hidden">Carregar mais canais</button>
 <p class="info" id="status">Carregando o catálogo compartilhado. Reprodução depende da disponibilidade de cada fonte.</p>
 <div class="tools"><button id="sync">↻ Atualizar listas</button><button id="reset">Limpar filtro</button></div>
 </main>
</div>
<div class="viewer hidden" id="viewer" role="dialog" aria-modal="true" aria-label="Player Stanley TV"><div class="viewer-inner"><div class="viewerhead"><strong id="playing">STANLEY TV</strong><button id="close">✕ Voltar ao catálogo</button></div><div class="screen" id="screen"><video id="video" class="hidden" playsinline controls preload="none"></video><iframe id="youtube" class="hidden" title="Player oficial do YouTube" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><div id="notice" class="notice">Carregando...</div></div><div class="controls"><button id="prev">◀ Anterior</button><button id="retry">↻ Repetir</button><button id="fav">☆ Favorito</button><button id="next">Próximo ▶</button><button class="primary" id="expand">⛶ Expandir</button></div><div class="diag" id="diagnostic">Aguardando...</div><div class="viewerfoot">YouTube: player oficial e anúncios preservados. IPTV: somente fontes compatíveis com este navegador.</div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), KEY='stanley-tv-integrada-v13', CATALOG='stanley-tv-playlists.json';
const starter=[
{id:'yt-monica',name:'Turma da Mônica',cat:'Infantil',type:'youtube',videoId:'MQwzkKwmIWY'},
{id:'yt-bob',name:'Bob Esponja ao Vivo',cat:'Infantil',type:'youtube',videoId:'dI6zxmg97u4'},
{id:'hls-amazon',name:'Amazon Sat',cat:'TV ao vivo',type:'hls',url:'https://amazonsat.brasilstream.com.br/hls/amazonsat/index.m3u8',logo:''}
];
let saved={favs:[],results:{}},channels=[],playlists=[],filter='Destaques',mode='all',query='',limit=25,shown=[],current=null,playToken=0,hls=null,previousFocus=null,loadRun=0;
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');if(Array.isArray(s.favs))saved.favs=s.favs;if(s.results&&typeof s.results==='object')saved.results=s.results}catch{}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{}};
const safeUrl=(v,base=location.href)=>{try{const u=new URL(v,base);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}};
const categories=['Destaques','Todos','Infantil','Esportes','Filmes','Séries','Novelas','Notícias','Entretenimento','Música','Educação','TV ao vivo','Outros'];
function groupCat(g){const x=String(g||'').toLowerCase();if(/kids|child|infantil|animation|desenho|cartoon/.test(x))return 'Infantil';if(/sports?|esporte|football/.test(x))return 'Esportes';if(/movies?|filmes?|cinema/.test(x))return 'Filmes';if(/series|séries|drama/.test(x))return 'Séries';if(/novela|telenovela/.test(x))return 'Novelas';if(/news|notícia|legislat/.test(x))return 'Notícias';if(/music|música/.test(x))return 'Música';if(/education|educação|documentary/.test(x))return 'Educação';if(/entertainment|comedy|lifestyle/.test(x))return 'Entretenimento';if(/general|tv aberta/.test(x))return 'TV ao vivo';return 'Outros'}
function parseM3U(txt,base,source){if(!/^\s*#EXTM3U(?:\s|$)/i.test(txt))throw Error('A URL não contém uma playlist M3U');const result=[];let meta=null;for(const raw of txt.replace(/\r/g,'').split('\n')){const row=raw.trim();if(row.startsWith('#EXTINF')){const attr=k=>(row.match(new RegExp(k+'="([^"]*)"','i'))||[])[1]||'';meta={name:row.slice(row.indexOf(',')+1).trim(),logo:attr('tvg-logo'),cat:groupCat(attr('group-title')),id:attr('tvg-id')};}else if(row.startsWith('#EXTGRP:')&&meta)meta.cat=groupCat(row.slice(8));else if(meta&&row&&!row.startsWith('#')){const url=safeUrl(row,base);if(url&&meta.name&&!/\.(?:ts|m4s)(?:\?|$)/i.test(url))result.push({...meta,id:'iptv-'+url,type:'hls',url,source});meta=null}}return result}
function allItems(){const m=new Map();for(const c of starter.concat(channels)){const id=c.type==='youtube'?'yt-'+c.videoId:c.url;if(!m.has(id))m.set(id,c)}return [...m.values()]}
function subset(){const items=allItems();return items.filter(c=>{if(mode==='fav'&&!saved.favs.includes(c.id))return false;if(mode==='iptv'&&c.type==='youtube')return false;if(mode==='youtube'&&c.type!=='youtube')return false;if(filter!=='Destaques'&&filter!=='Todos'&&filter!==c.cat)return false;if(filter==='Destaques'&&c.type!=='youtube'&&c.id!=='hls-amazon')return false;return c.name.toLocaleLowerCase('pt-BR').includes(query)})}
function setFilter(v){filter=v;limit=25;render();$('cards').scrollTop=0}
function btn(label,selected,handler){const b=document.createElement('button');b.className='sidebtn'+(selected?' active':'');b.textContent=label;b.onclick=handler;return b}
function render(){const items=allItems(),side=$('side');side.replaceChildren();const cap=document.createElement('h2');cap.textContent='EXPLORE';side.append(cap);for(const cat of categories){if(mode==='youtube'&&cat==='Todos'){}const n=cat==='Todos'?items.length:cat==='Destaques'?starter.length:items.filter(c=>c.cat===cat).length;if(n||cat==='Destaques'||cat==='Todos')side.append(btn(cat,filter===cat,()=>setFilter(cat)))}
const filtered=subset();shown=filtered;const result=$('cards');result.replaceChildren();for(const c of filtered.slice(0,limit)){const card=document.createElement('button');card.className='poster';card.onclick=()=>play(c);card.setAttribute('aria-label','Reproduzir '+c.name);const art=document.createElement('div');art.className='art'+(c.type==='youtube'?'':' logo');const img=document.createElement('img');img.loading='lazy';img.decoding='async';const source=c.type==='youtube'?'https://i.ytimg.com/vi/'+c.videoId+'/hqdefault.jpg':safeUrl(c.logo||'');if(source){img.src=source;img.alt='';img.onerror=()=>{img.remove();const d=document.createElement('span');d.className='placeholder';d.textContent='📺';art.append(d)};art.append(img)}else{const d=document.createElement('span');d.className='placeholder';d.textContent='📺';art.append(d)}const chip=document.createElement('span');chip.className='playchip';chip.textContent=c.type==='youtube'?'YouTube':'AO VIVO';art.append(chip);if(saved.favs.includes(c.id)){const star=document.createElement('span');star.className='favdot';star.textContent='★';art.append(star)}const name=document.createElement('span');name.className='name';name.textContent=c.name;name.title=c.name;const meta=document.createElement('span');meta.className='meta';meta.textContent=c.cat+(c.source?' · '+c.source:'');card.append(art,name,meta);result.append(card)}
$('heading').textContent=mode==='fav'?'Meus favoritos':mode==='iptv'?'Canais IPTV':mode==='youtube'?'Vídeos e programas':filter;$('counter').textContent=filtered.length+' conteúdos';$('total').textContent=items.length+' conteúdos cadastrados';$('more').classList.toggle('hidden',filtered.length<=limit);$('more').textContent='Carregar mais ('+(filtered.length-limit)+')';for(const [id,on] of [['home',mode==='all'],['iptv',mode==='iptv'],['youtubeMode',mode==='youtube'],['favorites',mode==='fav'],['popular',mode!=='fav'],['favTab',mode==='fav']])$(id).classList.toggle('active',on)}
function stopPlayback(){playToken++;if(hls){try{hls.destroy()}catch{}hls=null}const video=$('video');video.onerror=null;video.onplaying=null;try{video.pause();video.removeAttribute('src');video.load()}catch{}const y=$('youtube');y.src='about:blank';video.classList.add('hidden');y.classList.add('hidden')}
function notice(s){$('notice').textContent=s;$('notice').classList.remove('hidden')};function log(s){$('diagnostic').textContent=s}
function play(c){if(!c)return;previousFocus=document.activeElement;stopPlayback();current=c;const token=playToken;$('viewer').classList.remove('hidden');$('playing').textContent=c.name;$('fav').textContent=saved.favs.includes(c.id)?'★ Favorito':'☆ Favorito';notice('Carregando '+c.name+'...');log(c.type==='youtube'?'Iniciando player oficial do YouTube':'Iniciando transmissão IPTV');if(c.type==='youtube'){const y=$('youtube');y.classList.remove('hidden');y.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(c.videoId)+'?autoplay=1&playsinline=1&rel=0&mute=0';$('notice').classList.add('hidden');return}
const v=$('video');v.classList.remove('hidden');v.onplaying=()=>{if(token!==playToken)return;$('notice').classList.add('hidden');log('Reprodução iniciada')};v.onerror=()=>{if(token!==playToken)return;notice('Este canal não pôde ser reproduzido neste navegador.');log('Erro de vídeo: '+(v.error?.code||'desconhecido'))};const start=()=>{if(token!==playToken)return;try{v.play()?.catch(e=>{if(token===playToken)log('Pressione Play: '+e.name)})}catch(e){log(e.message)}};try{const native=!!v.canPlayType('application/vnd.apple.mpegurl');if(/iPad|iPhone|iPod/i.test(navigator.userAgent)&&native){v.src=c.url;v.load();start()}else if(window.Hls&&Hls.isSupported()){const player=new Hls({enableWorker:false,lowLatencyMode:false,maxBufferLength:18,backBufferLength:4,maxBufferSize:16*1024*1024});hls=player;player.on(Hls.Events.MEDIA_ATTACHED,()=>{if(token===playToken)player.loadSource(c.url)});player.on(Hls.Events.MANIFEST_PARSED,()=>{if(token===playToken)start()});player.on(Hls.Events.ERROR,(_,e)=>{if(token!==playToken)return;log('HLS: '+e.details+(e.fatal?' (fatal)':''));if(e.fatal){if(e.type===Hls.ErrorTypes.MEDIA_ERROR){try{player.recoverMediaError()}catch{}}else notice('Transmissão indisponível no Chrome. Pode haver bloqueio CORS ou no servidor.')}});player.attachMedia(v)}else if(native){v.src=c.url;v.load();start()}else notice('HLS não é suportado neste navegador')}catch(e){notice('Erro ao iniciar transmissão');log(e.message)}}
function switchChannel(n){if(!shown.length)return;const idx=shown.findIndex(c=>c.id===current?.id);play(shown[(idx<0?0:(idx+n+shown.length)%shown.length)])}
function close(){stopPlayback();current=null;$('viewer').classList.add('hidden');if(previousFocus?.isConnected)previousFocus.focus();else $('cards button')?.focus()}
$('prev').onclick=()=>switchChannel(-1);$('next').onclick=()=>switchChannel(1);$('retry').onclick=()=>play(current);$('close').onclick=close;$('fav').onclick=()=>{if(!current)return;const idx=saved.favs.indexOf(current.id);if(idx<0)saved.favs.push(current.id);else saved.favs.splice(idx,1);persist();$('fav').textContent=idx<0?'★ Favorito':'☆ Favorito';render()};$('expand').onclick=()=>{const p=$('screen').requestFullscreen?.();if(p?.catch)p.catch(()=>log('Tela cheia não autorizada'))};$('tvMode').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})};
$('search').oninput=v=>{query=v.target.value.trim().toLocaleLowerCase('pt-BR');limit=25;render()};$('home').onclick=()=>{mode='all';setFilter('Destaques')};$('iptv').onclick=()=>{mode='iptv';setFilter('Todos')};$('youtubeMode').onclick=()=>{mode='youtube';setFilter('Todos')};$('favorites').onclick=$('favTab').onclick=()=>{mode='fav';setFilter('Todos')};$('popular').onclick=()=>{mode='all';setFilter('Destaques')};$('more').onclick=()=>{limit+=25;render()};$('reset').onclick=()=>{mode='all';filter='Destaques';query='';$('search').value='';limit=25;render()};$('sync').onclick=()=>sync(true);
async function sync(force=false){const run=++loadRun;const status=$('status');status.textContent='Sincronizando catálogo...';try{const r=await fetch(CATALOG+(force?'?v='+Date.now():''),{cache:'no-store'});if(!r.ok)throw Error('Catálogo HTTP '+r.status);const doc=await r.json();if(!Array.isArray(doc.playlists))throw Error('Catálogo inválido');playlists=doc.playlists;const combined=[];let errors=0;for(const p of playlists){if(run!==loadRun)return;const url=safeUrl(p.url);if(!url)continue;try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),18000);let res;try{res=await fetch(url,{cache:'no-store',signal:ctl.signal})}finally{clearTimeout(t)}if(!res.ok)throw Error('HTTP '+res.status);const text=await res.text();combined.push(...parseM3U(text,url,p.name||'IPTV'));}catch(e){errors++;status.textContent='Falha em '+(p.name||'lista')+': '+e.message}}if(run!==loadRun)return;const seen=new Set();channels=combined.filter(c=>{if(seen.has(c.url))return false;seen.add(c.url);return true});status.textContent='IPTV: '+channels.length+' transmissões carregadas de '+playlists.length+' listas'+(errors?' · '+errors+' falha(s)':'')+'. Algumas fontes podem não reproduzir no Chrome.';render()}catch(e){status.textContent='Não foi possível carregar o catálogo IPTV: '+e.message+'. YouTube e Amazon Sat continuam disponíveis.';render()}}
// Navegação por controle remoto: setas saltam entre os botões visíveis.
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'&&e.target.tagName!=='INPUT'){if(!$('viewer').classList.contains('hidden')){close();e.preventDefault()}return}if(!e.key.startsWith('Arrow')||e.target.tagName==='INPUT')return;const area=$('viewer').classList.contains('hidden')?document.querySelector('.shell'):$('viewer');const buttons=[...area.querySelectorAll('button')].filter(b=>b.getClientRects().length&&!b.disabled);const active=document.activeElement;if(!buttons.includes(active)){buttons[0]?.focus();e.preventDefault();return}const a=active.getBoundingClientRect(),cx=a.left+a.width/2,cy=a.top+a.height/2;let best=null,score=Infinity;for(const b of buttons){if(b===active)continue;const z=b.getBoundingClientRect(),dx=z.left+z.width/2-cx,dy=z.top+z.height/2-cy,dir=e.key==='ArrowRight'?dx:e.key==='ArrowLeft'?-dx:e.key==='ArrowDown'?dy:-dy;if(dir<=3)continue;const lateral=e.key==='ArrowRight'||e.key==='ArrowLeft'?Math.abs(dy):Math.abs(dx),n=dir+2*lateral;if(n<score){score=n;best=b}}if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'});e.preventDefault()}});
render();sync();
})();
